<app-header></app-header>
<main>
  <div>
    <ul id="users">
      @for (user of users; track user.id){
        <li><app-user (selectUser)="selectUser($event)" [user]="user" /></li>

      }
    </ul>
  </div>
  @if(selectedUser){
    <app-user-tasks [name]="selectedUser ? selectedUser.name : ''" [userId]="selectedUserId"></app-user-tasks>
  } @else{
    <p id="fallback">Select a user to see their tasks!</p>
  }
</main>
